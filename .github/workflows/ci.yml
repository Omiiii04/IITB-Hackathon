name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    name: Lint, Test & Build Validation
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ecommerce_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d ecommerce_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      NODE_ENV: test
      DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/ecommerce_test?schema=public"
      DIRECT_URL: "postgresql://postgres:postgres@localhost:5432/ecommerce_test?schema=public"

      JWT_ACCESS_SECRET: "ci_test_jwt_access_secret_key_minimum_32_chars!"
      JWT_REFRESH_SECRET: "ci_test_jwt_refresh_secret_key_minimum_32_chars!"

      # Google OAuth — non-functional CI placeholders. Variables are optional
      # at the schema level; the OAuth route returns 503 when they are absent.
      # These values are intentionally fake and committed only for CI build.
      GOOGLE_CLIENT_ID: "ci-placeholder.apps.googleusercontent.com"
      GOOGLE_CLIENT_SECRET: "ci-placeholder-secret"
      GOOGLE_CALLBACK_URL: "http://localhost:3000/api/auth/oauth/google"


    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Run ESLint
        run: npm run lint

      - name: Run TypeScript type-check
        run: npx tsc --noEmit

      - name: Run Unit & Integration Tests
        run: npm run test

      - name: Run Production Build
        run: npm run build
