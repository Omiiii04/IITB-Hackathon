name: CD Pipeline

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      target_url:
        description: 'Target Deployment URL to verify'
        required: false
        default: 'https://iitb.omiiii.me'
        type: string

concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  validate:
    name: Pre-Flight CI Validation
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ecommerce_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d ecommerce_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      NODE_ENV: test
      DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/ecommerce_test?schema=public"
      DIRECT_URL: "postgresql://postgres:postgres@localhost:5432/ecommerce_test?schema=public"
      JWT_ACCESS_SECRET: "ci_test_jwt_access_secret_key_minimum_32_chars!"
      JWT_REFRESH_SECRET: "ci_test_jwt_refresh_secret_key_minimum_32_chars!"
      GOOGLE_CLIENT_ID: "ci-placeholder.apps.googleusercontent.com"
      GOOGLE_CLIENT_SECRET: "ci-placeholder-secret"
      GOOGLE_CALLBACK_URL: "http://localhost:3000/api/auth/oauth/google"

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Run ESLint
        run: npm run lint

      - name: Run TypeScript Type-Check
        run: npx tsc --noEmit

      - name: Run Unit & Integration Tests
        run: npm run test

      - name: Build Next.js Standalone
        run: npm run build

  deploy:
    name: Trigger Railway Deployment
    needs: [validate]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy to Railway via CLI (Optional Token Trigger)
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_SERVICE: ${{ secrets.RAILWAY_SERVICE_NAME }}
        run: |
          if [ -n "$RAILWAY_TOKEN" ]; then
            echo "🚀 RAILWAY_TOKEN detected. Triggering Railway deployment via CLI..."
            npm install -g @railway/cli
            if [ -n "$RAILWAY_SERVICE" ]; then
              railway up --service "$RAILWAY_SERVICE" -d
            else
              railway up -d
            fi
            echo "✅ Railway deployment triggered successfully."
          else
            echo "ℹ️ RAILWAY_TOKEN secret not configured in repository."
            echo "ℹ️ Relying on Railway native GitHub Integration (automatic build on git push to main)."
          fi

  smoke-test:
    name: Post-Deployment Smoke & Health Verification
    needs: [deploy]
    runs-on: ubuntu-latest
    if: always() && (needs.deploy.result == 'success' || needs.deploy.result == 'skipped')

    steps:
      - name: Poll Health Endpoint with Retry Backoff
        id: health_check
        env:
          TARGET_URL: ${{ github.event.inputs.target_url || 'https://iitb.omiiii.me' }}
        run: |
          echo "🔍 Target URL: $TARGET_URL"
          MAX_ATTEMPTS=12
          SLEEP_SECONDS=15
          SUCCESS=0

          echo "⏳ Waiting for Railway build and deployment to become live..."
          sleep 20

          for i in $(seq 1 $MAX_ATTEMPTS); do
            echo "👉 Attempt $i of $MAX_ATTEMPTS: Probing $TARGET_URL/api/health..."
            
            HTTP_RESPONSE=$(curl -s -w "\n%{http_code}" "$TARGET_URL/api/health" || true)
            HTTP_BODY=$(echo "$HTTP_RESPONSE" | sed '$d')
            HTTP_CODE=$(echo "$HTTP_RESPONSE" | tail -n 1)

            echo "Response Status: $HTTP_CODE"

            if [ "$HTTP_CODE" = "200" ]; then
              echo "✅ Health endpoint responded HTTP 200 OK!"
              echo "$HTTP_BODY"
              SUCCESS=1
              break
            else
              echo "⚠️ Service not ready yet (HTTP $HTTP_CODE). Retrying in $SLEEP_SECONDS seconds..."
              sleep $SLEEP_SECONDS
            fi
          done

          if [ "$SUCCESS" -eq 1 ]; then
            echo "is_healthy=true" >> "$GITHUB_OUTPUT"
          else
            echo "❌ Service did not respond with HTTP 200 within $(($MAX_ATTEMPTS * $SLEEP_SECONDS + 20)) seconds."
            echo "is_healthy=false" >> "$GITHUB_OUTPUT"
            exit 1
          fi

      - name: Verify Core Public Endpoints
        env:
          TARGET_URL: ${{ github.event.inputs.target_url || 'https://iitb.omiiii.me' }}
        run: |
          echo "Testing Public Storefront Landing Page..."
          curl -f -s -I "$TARGET_URL/" > /dev/null
          echo "✅ Storefront Landing (/) OK"

          echo "Testing Public Products API..."
          curl -f -s "$TARGET_URL/api/products" > /dev/null
          echo "✅ Products API (/api/products) OK"

          echo "Testing Public Categories API..."
          curl -f -s "$TARGET_URL/api/categories" > /dev/null
          echo "✅ Categories API (/api/categories) OK"

      - name: Generate Deployment Summary
        if: always()
        env:
          TARGET_URL: ${{ github.event.inputs.target_url || 'https://iitb.omiiii.me' }}
        run: |
          echo "### 🚀 Continuous Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **Target URL**: [$TARGET_URL]($TARGET_URL)" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit**: \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch**: \`${{ github.ref_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Health Endpoint**: [\`$TARGET_URL/api/health\`]($TARGET_URL/api/health)" >> $GITHUB_STEP_SUMMARY
          echo "- **Status**: ${{ job.status == 'success' && '🟢 Live & Verified' || '🔴 Deployment / Verification Failed' }}" >> $GITHUB_STEP_SUMMARY
